<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenara - Digital Asset Platform</title>
    <style>
        :root {
            --bg-color: #0b0f0e;
            --card-bg: #131a18;
            --primary: #00ff66;
            --primary-hover: #00cc52;
            --accent-gold: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --danger: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            box-sizing: border-box;
            margin: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 8px 0;
            font-size: 24px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .logo-icon {
            font-size: 36px;
        }

        .error-banner {
            background-color: rgba(255, 77, 77, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #0b0f0e;
            border-radius: 8px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000000;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0b0f0e;
            border: 1px solid #2a3b35;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .dashboard-view, .auth-view {
            display: none;
        }

        .dashboard-view.active, .auth-view.active {
            display: block;
        }

        .balance-card {
            background: #0b0f0e;
            border: 1px solid var(--accent-gold);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-card h3 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 22px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .menu-btn {
            padding: 12px;
            background: #1b2622;
            border: 1px solid #2a3b35;
            color: var(--text-main);
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            transition: border-color 0.3s;
        }

        .menu-btn:hover {
            border-color: var(--primary);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-icon">⚡</div>
            <h1>Greenara</h1>
            <p>Kenya's Digital Asset Tap & Earn Platform</p>
        </div>

        <!-- Connection Error Banner -->
        <div id="errorBanner" class="error-banner">
            Connection error. Make sure backend is running on Render.
        </div>

        <!-- Auth View (Login / Register) -->
        <div id="authView" class="auth-view active">
            <div class="tabs">
                <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button id="registerTabBtn" class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <div class="form-group">
                <label id="usernameLabel">Mobile Number / Username</label>
                <input type="text" id="userInput" placeholder="e.g. 0712345678">
            </div>

            <div class="form-group">
                <label>Access Password</label>
                <input type="password" id="passInput" placeholder="••••••••">
            </div>

            <button id="authSubmitBtn" class="btn-primary" onclick="handleAuth()">Register & Start Earning</button>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="dashboard-view">
            <div class="balance-card">
                <p style="margin:0 0 5px 0; font-size:12px; color:var(--text-muted);">Available Balance</p>
                <h3 id="userBalance">0.00 Ksh</h3>
            </div>

            <div class="menu-grid">
                <button class="menu-btn" onclick="alert('Tap mining levels active!')">⚡ Earning Asset Levels</button>
                <button class="menu-btn" onclick="alert('Activation request screen')">📥 Deposit / Top Up</button>
                <button class="menu-btn" onclick="alert('Withdrawal request screen')">💸 Withdraw Funds</button>
                <button class="menu-btn" onclick="alert('Support ticket screen')">💬 Send Complaint / Ticket</button>
            </div>

            <button class="menu-btn logout-btn" onclick="handleLogout()">🚪 Logout</button>
        </div>
    </div>

    <script>
        // POINTED TO YOUR NEW RENDER BACKEND
        const BACKEND_URL = "https://greenara-backend-1.onrender.com";

        let currentMode = 'login'; // 'login' or 'register'
        let currentUser = null;

        function switchTab(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (mode === 'login') {
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
                submitBtn.innerText = 'Login to Account';
            } else {
                registerBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'Register & Start Earning';
            }
        }

        async function handleAuth() {
            const username = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const errorBanner = document.getElementById('errorBanner');

            if (!username || !password) {
                alert('Please fill in all fields.');
                return;
            }

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';

            try {
                errorBanner.style.display = 'none';
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    showDashboard();
                } else {
                    alert(data.message || 'Authentication failed.');
                }
            } catch (err) {
                console.error(err);
                errorBanner.style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('authView').classList.remove('active');
            document.getElementById('dashboardView').classList.add('active');
            document.getElementById('userBalance').innerText = `${currentUser.balance.toFixed(2)} Ksh`;
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboardView').classList.remove('active');
            document.getElementById('authView').classList.add('active');
        }

        // Quick Ping to verify backend connection on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await fetch(`${BACKEND_URL}/`);
                document.getElementById('errorBanner').style.display = 'none';
            } catch (e) {
                document.getElementById('errorBanner').style.display = 'block';
            }
        });
    </script>
</body>
</html>
